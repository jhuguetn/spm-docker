name: Build & Deploy SPM12 (pinned version)
on:
  workflow_dispatch: {}
  push:
    branches: [ spm12-ubuntu20.04 ]  # pinned branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: spm12-ubuntu20.04
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./matlab
          file: ./matlab/Dockerfile
          platforms: linux/amd64
          push: true
          tags: | 
            ghcr.io/${{ github.repository }}:12-ubuntu20.04
            ghcr.io/${{ github.repository }}:12-ubuntu20.04-${{ github.sha }}
          provenance: false
